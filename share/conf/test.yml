# PAGI WebServer Framework Configuration

# Stage: staging, staging, production
stage: staging

modules:
  "^WebFramework::Module::AutoIndex": {}
  "^WebFramework::Module::SiteLogo":
    site_logo: public/images/LukeHPSite.svg
  Template:
    paths:
      - templates
      - templates/partials
      - ../PAGI-WebServer/templates
      - ../PAGI-WebServer/templates/partials
    conf:
      EVAL_PERL: 1
# Server configuration
server:
  host: 0.0.0.0
  port: 3001
  worker_threads: 4

# Directory paths
css_dir: share/styles
typescript_dir: src/ts
markdown_dir: share/pages
# relative to the public directory

# Pandoc modules to load
pandoc_modules: []

log_base: Schierer-HPFan
site_url: https://dev.hp-fan.schierer.org

log_config:
  default: DEBUG
  'App::Schierer::HP-Fan': INFO
  'App::Schierer::HPFan::Controller::Root': DEBUG
  'WebFramework': INFO
  'WebFramework::Module::Navigation': DEBUG
  'WebFramework::Role::Markdown': INFO