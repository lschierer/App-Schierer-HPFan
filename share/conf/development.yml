# PAGI WebServer Framework Configuration

# Stage: localDev, staging, production
stage: localDev

modules:
  Template:
    paths:
      - templates
      - templates/partials
      - ../PAGI-WebServer/templates
      - ../PAGI-WebServer/templates/partials
    conf:
      EVAL_PERL: 1
# Server configuration
server:
  host: 0.0.0.0
  port: 3000

# Template configuration
template:
  INCLUDE_PATH:
    - templates
    - templates/partials
    - ../PAGI-WebServer/templates
    - ../PAGI-WebServer/templates/partials

# Directory paths
css_dir: share/styles
typescript_dir: src/ts
markdown_dir: share/pages

# Pandoc modules to load
pandoc_modules: []

# Worker thread configuration
worker_threads: 4

# Module-specific log levels
log_config: {}
