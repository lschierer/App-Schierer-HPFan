    stains, and other messes.\n\n## Myths\n\n- This charm is not a [banishing][] charm.
    You would not use it to unpack a suit\n  case.[^221215-1]\n\n## Found in\n\nPrimary
    Cannon\n: citation needed.\n\nSecondary Cannon\n: [magicscrapbook](https://magicscrapbook.tumblr.com/)\n
