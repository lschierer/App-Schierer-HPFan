  type: spell
- category: spell
  content: "## Classification\n\nThis is described as a jinx despite being powerful
    enough to break most if not all known defensive enchantments. \n\n## Description
    \n\nThis appears to be a _class_ of magic rather than a specific spell, as we
    are\ntold that \"the name has been jinxed,\" with \"a Taboo\"[^240212-1] rather
    than with\n\"the Taboo.\"\n\nThe very existence of this thing in book seven is,
    in and of itself, a plot\nhole. The tone gives the impression that [Ron] is so
    familiar with it that it\nshould not even need explanation. On the other hand,
    [Hermione] has clearly\n_not_ heard of it before, and it has never before been
    used to explain the fear\nof using [Riddle]'s name.\n\nIf this is a common thing,
    someone should have said something to the effect that\nusing [Riddle]'s name called
    down Death Eaters during the prior war.\n\nIf it is a brand new thing, [Ron]'s
    explanation, while it does have all the\nnecessary information, should have more
    wonder and surprise that this is\npossible, and not \"why do you not know this\"
    to it.\n\nIf is well known but restricted in some way, what does the restricting?
    _Why_\n(for example) must one control the Ministry to set a Taboo?\n\n## Found
    in\n\nPrimary Cannon \n: citation needed.\n\n[Riddle]: </Harrypedia/people/Riddle/Tom
    Marvolo/>\n[Harry]: </Harrypedia/people/Potter/Harry James/>\n[Hermione]: </Harrypedia/people/Granger/Hermione
    Jean/>\n[Ron]: </Harrypedia/people/Weasley/Ronald Bilius/>\n\n[^240212-1]:\n    Mrs.
    J. K. Rowling. _[Harry Potter and the Deathly Hallows]_ Bloomsburg\n    Publishing.
    © 2011. Page 161\n\n[Harry Potter and the Deathly Hallows]:\n  https://www.librarything.com/work/3577382/"
