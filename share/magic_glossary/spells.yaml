  title: Impedimenta
  type: jinx
- category: spell
  content: "## Classification\n\nCurse\n\n## Description\n\nAlso known as the Imperius
    Curse, this is one of the places where Mrs. Rowling\nhas left us a bit of a conundrum.
    How exactly does this curse work? Fan fiction\nauthor Old Crow has perhaps the
    most thoughtful explanation.\n\n> The Imperius curse was fairly easy to administer
    on a short-term basis. It was\n> no particular feat for a competent wizard to
    cast the curse on an unsuspecting\n> victim, and force him to torture his own
    family while the Death Eater was in\n> the man's presence, then wake him up so
    that the victim could see the results\n> of his own hand. At each juncture, the
    victim could be told what to do.\n>\n> Long-term casting was an entirely different
    matter. It had been simple enough\n> for Senior to place his son under the curse
    with the ongoing instruction, Sit\n> in your room and stare at the wall . It would
    be completely different to hold\n> a victim under the curse for months on end
    and tell them to Act normally and\n> tell no one about what was going on. Twelve
    years ago, Riddle could have\n> accomplished the task with some effort and with
    weekly\n> reinforcement.[^220924-1]\n\nThis explanation fits with both all sorts
    of Death Eaters many of which are\ndescribed as having low intelligence casting
    this, along with the other\nunforgivables, with people in the Ministry having
    been mind controlled long\nterm, and the various descriptions of fighting off
    the curse.\n\n## Found in\n\nPrimary Cannon \n: Mrs. J. K. Rowling.\n  _[Harry
    Potter and the Goblet of Fire](https://www.librarything.com/work/113/book/203684953)_\n
    \ Kindle Location 3217. Pottermore Limited. American Kindle Edition.\n\nFan Fiction\n:
    Old Crow.\n  _[An Inconvenient Truth](https://www.fanfiction.net/s/5084287)_\n
    \ [Chapter 8](https://www.fanfiction.net/s/5084287/8/An-Inconvenient-Truth)\n
    \ Updated 2016-06-22. Published: 2009-05-24.\n\n[^220924-1]:\n    Old Crow. _[An
    Inconvenient Truth](https://www.fanfiction.net/s/5084287)_\n    [Chapter 8](https://www.fanfiction.net/s/5084287/8/An-Inconvenient-Truth)\n
    \   Updated 2016-06-22. Published: 2009-05-24."
