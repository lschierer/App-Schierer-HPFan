  content: "## Classification\n\nTransfiguration (Conjuring)\n\n## Description\n\n>
    I find the Serpensortia charm to be… problematic. The description in the books\n>
    is a bit vague, but seems to imply that Malfoy created the snake, rather than\n>
    summoning it. I don't like the idea of it being a true conjuration, that is,\n>
    creating something from nothing. The idea that Malfoy is skilled enough as a\n>
    2nd year to conjure a snake that can understand parseltongue is ridiculous. In\n>
    book 6, Hermione conjures some birds while moping about Ron and Lavender, and\n>
    Harry is impressed by her spell work. Surely a snake would be at least as\n> difficult,
    if not more so. So, I decided to go with the non-spatial summoning\n> charm described
    above.[^210629-6]\n\nThe transcription of the [Book of Spells][] references a
    \"Principle of\nArtificianimate Quasi-Dominance\" and goes on to state that for
    poorly understood\nand entirely unstated reasons, birds and snakes are easier
    to conjure than\nanything else.[^210930-21] I do not feel this rather hand-wavy
    quasi-explanation\ntruly addresses Mr. Hycrest's objections above.\n\n[Book of
    Spells]:\n  https://magicscrapbook.tumblr.com/post/162085200042/book-of-spells-transcript\n\n[^210629-6]:\n
    \   Ian Hycrest.\n    _[Harry Potter and the Hands of Justice](https://www.fanfiction.net/s/13374289)_\n
    \   [Chapter 11](https://www.fanfiction.net/s/13374289/12/Harry-Potter-and-the-Hands-of-Justice)\n
    \   Published: 2019-08-27. Updated: 2020-01-14. Last Viewed: 2021-06-29.\n\n[^210930-21]:
    [magicscrapbook](https://magicscrapbook.tumblr.com/)\n\n    <!-- cspell: disable-line
    -->\n\n    \"[‘Book of Spells’ transcript](https://magicscrapbook.tumblr.com/post/162085200042/book-of-spells-transcript)\"\n
    \   Last Viewed 2021-09-30.\n\n## Found in\n\nPrimary Cannon \n: citation needed.\n\nSecondary
    Cannon \n: [magicscrapbook](https://magicscrapbook.tumblr.com/)\n  \"[‘Book of
    Spells’ transcript](https://magicscrapbook.tumblr.com/post/162085200042/book-of-spells-transcript)\"\n
    \ Last Viewed 2021-09-30.\n\nFan Fiction \n: Ian Hycrest.\n  _[Harry Potter and
    the Hands of Justice](https://www.fanfiction.net/s/13374289)_\n  Published: 2019-08-27.
    Updated: 2020-01-14. Last Viewed: 2021-06-29."
