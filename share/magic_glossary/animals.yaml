- category: animal
  title: Thestral
  content: |-
    A breed of winged horse that possesses a conditional power of invisibility.[^260330-1]  That is, it is invisible to all except those who both possess magic, have personally seen death, and have internalized/understood it. The nature of this condition has caused many to consider the thestral unlucky.[^260330-2]  Thestrals are universally black.[^260330-3]

    [^260330-1]: Mrs. J. K. Rowling. _[Harry Potter and the Order of the Phoenix]_.  American Kindle Edition.

    [^260330-3]: Mrs. J. K. Rowling. _[Harry Potter and the Order of the Phoenix]_.  American Kindle Edition.

    [^260330-2]: Mrs. J. K. Rowling. _[Fantastic Beasts and Where to Find Them: Illustrated edition]_.  Page 127 of 157. American Kindle Edition. Text copyright © J.K. Rowling 2001, 2017

    [Harry Potter and the Order of the Phoenix]: https://www.librarything.com/work/115

    [Fantastic Beasts and Where to Find Them: Illustrated edition]: https://www.librarything.com/work/642676
- category: animal
  title: Unicorn
  # cspell: ignore Tarr
  content: |-
    The unicorn dates back pretty much as far back as you care to go, though the
    earliest references may in fact be talking about an auroch, a purely mundane
    animal, and not a true unicorn.[^220726-1] Several of the next most recent
    accounts are fairly clearly describing, in turn, an oryx and a
    rhinoceros.[^220726-2] However, these accounts are considered the basis for the
    animal in human accounts.[^220726-3] It is in the second century that the
    unicorn's docility in the presence of a maiden, or at least a virgin female
    (unsure how old the girl can be and still count) are first
    referenced.[^220726-4]

    Many healing potions use unicorn's horn, with the earliest accounts
    demonstrating that the horn need not be willingly given.[^220726-5]

    It is unclear whether the unicorn is more goat-like or more horse like in
    appearance, at one point did the scarcity of the beast and the separation of the
    magical world start to blur the mundane accounts of the animal?[^220726-6]

    [^220726-1]:
        [St Neots Museum](https://www.stneotsmuseum.org.uk/)
