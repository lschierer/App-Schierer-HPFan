- category: potion
  type: potion
  title: Amortentia
  content: |-
    The most powerful known [love potion].  It causes intense infatuation or obsession, but cannot create actual love.  It is recognized by a mother-of-pearl sheen, steam rising in spirals, and an aroma tailored to what each person finds most attractive.

    Slughorn calls it the most dangerous potion in his classroom.  The [Department of Mysteries][] keeps a fountain of Amortentia at the centre of the locked Love Room for study.

    [Department of Mysteries]: /Harrypedia/culture/Government
    
    ## Found in

    ### Primary Cannon

    1. Mrs. J. K. Rowling.
       _[Harry Potter and the Order of the Phoenix](https://www.goodreads.com/book/show/2.Harry_Potter_and_the_Order_of_the_Phoenix)_
       Chapter 37, "The Lost Prophecy."
       Dumbledore describes the locked room in the Department of Mysteries as containing
       a force "more wonderful and more terrible than death."

    1. Mrs. J. K. Rowling.
       _[Harry Potter and the Half-Blood Prince](https://www.goodreads.com/book/show/1.Harry_Potter_and_the_Half_Blood_Prince)_
       Chapter 9, "The Half-Blood Prince."
       Slughorn introduces Amortentia in class.  It has a mother-of-pearl sheen, steam
       rising in characteristic spirals, and smells differently to each person according
       to what attracts them.  Harry smells treacle tart, a broomstick handle, and a
       flowery scent (later associated with Ginny).  Hermione identifies parchment and
       freshly-mown grass.

    1. Mrs. J. K. Rowling.
       _[Harry Potter and the Half-Blood Prince](https://www.goodreads.com/book/show/1.Harry_Potter_and_the_Half_Blood_Prince)_
       Chapter 10, "The House of Gaunt."
       Dumbledore believes Merope Gaunt used a love potion, possibly Amortentia, on
       Tom Riddle Sr. to trick him into marriage.

    1. Mrs. J. K. Rowling.
       _[Harry Potter and the Half-Blood Prince](https://www.goodreads.com/book/show/1.Harry_Potter_and_the_Half_Blood_Prince)_
       Chapter 15, "The Unbreakable Vow."
       Romilda Vane attempts to give Harry a love potion.

    1. Mrs. J. K. Rowling.
       _[Harry Potter and the Half-Blood Prince](https://www.goodreads.com/book/show/1.Harry_Potter_and_the_Half_Blood_Prince)_
       Chapter 18, "Birthday Surprises."
       Ron consumes Romilda's love potion-laced chocolate cauldrons months after they
       were made; the potion has grown stronger with age.

    ### Tertiary Cannon

    1. Mrs. J. K. Rowling.
       "[The Leaky Cauldron and MuggleNet interview Joanne Kathleen Rowling: Part Two](https://www.accio-quote.org/articles/2005/0705-tlc_mugglenet-anelli-2.htm)"
       2005-07-16.
       Rowling confirms the Love Room at the Department of Mysteries has a fountain of
       Amortentia at its centre.

    1. Mrs. J. K. Rowling.
       "[Bloomsbury Live Chat](https://www.accio-quote.org/articles/2007/0730-bloomsbury-chat.html)"
       2007-07-30.
       Rowling confirms Hermione's third smell from the Amortentia was Ron's hair.
       Discusses Merope's use of a love potion on Tom Riddle as symbolic of a loveless union.

