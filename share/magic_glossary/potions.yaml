- category: potion
  type: potion
  title: Love Potions
  content: |-
    Even though [Amortentia] is the only one named, there are apparently many different potions that fall into this general category.
    Despite the name, these potions do not actually create or induce love.  They mimic some of the effects associated with love, 
    although the difference between love and lust is not always recognized in making this claim.  Love potions grow stronger with 
    age, making old ones particularly dangerous.

    They are banned at Hogwarts, though this ban is widely flouted.  [Fred] and [George] [Weasley] sell them as part of their 
    WonderWitch product line, and smuggle them into Hogwarts disguised as perfumes and cough potions via their Owl Order Service.

    [Fred]: /Harrypedia/people/Weasley/Fred
    [George]: /Harrypedia/people/Weasley/George
    [Weasley]: /Harrypedia/people/Weasley

