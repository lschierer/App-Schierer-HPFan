      While this story avoids all out [Ginny] bashing, I do not care for the way it portrays her.  I think it neither 
      fair nor entirely accurate.  I *do* think the portrayal of *[Molly]* is possible.  In either case, I think this 
      is an interesting exploration on the ways that laws in a magical society might work, might have consequences that are disliked but inescapable, and might be generally complicated.

      [Ginny]: </Harrypedia/people/Weasley/Ginevra Molly>
