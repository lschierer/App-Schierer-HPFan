name: Harry and Lavender
title: Harry Paired with Lavender
comments: |
  [Lavender] rarely gets much screen time in fan fiction, and even less of that is positive. To be fair, she very much 
  comes across as a girly-girl or cheerleader type in the books, and it is hard to picture a situation where [Harry] 
  can relate to that.  Still, one should recall that she was sorted into [Gryffindor], and that however deeply buried or untapped, there must be a reason for that.

  [Lavender]: /Harrypedia/people/Brown/Lavender
