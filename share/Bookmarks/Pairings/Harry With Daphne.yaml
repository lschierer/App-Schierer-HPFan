  - title:
      name: A Different Type of Bond
      link: https://archiveofourown.org/works/38269633
    author:
      name: WolfgangNH
      link: https://archiveofourown.org/users/WolfgangNH/
    dates:
      published: 2022-04-09
      completed: 2022-04-09
    comments: |-
      I have mixed feelings on this story, and am including it on my policy of including any story I have to spend time finding at least twice.  This 
      story includes one suicide attempt and one (separate) suicide contemplation.  On the positive side, the story treats suicide as the horrific 
      thing it is.  On the bad side, in includes the idea that if you save a life, you are responsible for it.  I think the author attempted to portray 
      just how badly this could have gone.  I do not think [WolfgangNH] really succeeded at that though, which is a problem.  Several aspects of this 
      story fit in very well as illustrations of the problems with the way Mrs. Rowling has structured the world.

      [WolfgangNH]: https://archiveofourown.org/users/WolfgangNH/
  - title:
      name: Contractual Invalidation 
      link: https://www.fanfiction.net/s/11697407 
    author:
      name: R-dude 
      link: https://www.fanfiction.net/u/2057121/R-dude 
    dates:
      published: 2015-12-28
      completed: 2017-01-06
    comments: |-

      I have *really* mixed feelings about this story. Magical
      contracts fascinate me. Thus that aspect of this story draws me
      in. [Ginny]'s appearance is brief, but the impression given is
      that she in [Harry] are *too* similar, ended up fighting, and
      not speaking long enough neither knew how to repair the
      relationship. I can accept that. 

      The problem is [Harry]. This portrays a version of him where,
      after graduation, he became a version of himself who might indeed
      have done well in [Slytherin]. It fits well with Mrs. Rowling's
      post book comments about [Harry] becoming the youngest head of the
      Auror office ever. But it simply doesn't *feel* like him. There's
      so much going on so fast in this story. So much where you *know*
      you aren't being told everything, and maybe aren't even being told
      the truth. It's hard to understand the story in places. Even after
      the reveal at the end.

