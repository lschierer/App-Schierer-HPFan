    author:
      name: PetrificusSomewhatus
    dates:
      published: 2018-11-29
      updated: 2020-05-03
    comments: |-
      This story and its sequel are enough to make you interested in this pairing no matter what else you might otherwise think.  [Daphne] is 
      believable, [Ginny] is reasonably well done, the only real change is that [Harry] has caught on to the fact that [Dumbledore] is not to 
      be trusted early on in sixth year.  Everything flows from that.

