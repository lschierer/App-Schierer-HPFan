name: Luna
title: Featuring Luna
comments: |
  In general I feel that while [Luna] and [Harry] will almost always be friends, that unless you change one or the other significantly, they will never be more than that. Still, there are some stories where she is the main character that are worth remembering.

  [Harry]: </Harrypedia/people/Potter/Harry James>
  [Luna]: /Harrypedia/people/Lovegood/Luna/
items:
  - title:
      name: >-
        It's Always The Quiet Ones
      link: https://www.fanfiction.net/s/11636560
    author:
      name: PixelWriter1
      link: https://www.fanfiction.net/u/5088760
    dates:
      published: 2015-11-27
    comments: |-
      This one has no particular pairing, and avoids names in a few places that is both odd and slightly annoying.  I have never read any of [H. P. Lovecraft]'s works, as I do not in general like horror, but I *am* vaguely familiar with his body of work.  Here [Luna] is descended from the [Marsh Family][MFLC], from [H. P. Lovecraft]'s stories.  When pushed too far one day, that heritage comes out…

      [H. P. Lovecraft]: https://wikipedia.org/wiki/H._P._Lovecraft
      [MFLC]: https://lovecraft.fandom.com/wiki/Marsh_family
      [Luna]: /Harrypedia/people/Lovegood/Luna/
  - title:
      name: When Is It a Contract
      link: https://www.fanfiction.net/s/7382549/
    author:
      name: Aealket
      link: https://www.fanfiction.net/u/1271272/Aealket
    dates:
      published: 2011-09-14
      completed: 2011-09-14
    comments: |-
      This work *suggests* pairings, but does not come out and state what happens.  It
      is almost a cross between an extended one-shot and a story prompt, finishing with
      more of a suggestion of what will happen than a finished plot.  It is most notable
      for several reasons.  First of all, it takes a some what divergent view of the [Lovegood]
      family general, with a focus on [Luna].  This author has chosen to extend the canonical
      representation by giving both a reason for the way she *is* treated and why that is
      wrong, ironically at once.  Secondly it is notable in that it could qualify for
      the [Responsible Adults] category.  Third, it has a few points to make about [magical contracts].
      On the down side, it goes a bit overboard in the way it represents [Ron]; not a *lot* overboard, but enough to notice.

      [Lovegood]: /Harrypedia/people/Lovegood
      [Luna]: /Harrypedia/people/Lovegood/Luna
      [Responsible Adults]: </Bookmarks/Responsible Adults>
      [Ron]: </Harrypedia/people/Weasley/Ronald Bilius>
      [magical contracts]: /Harrypedia/magic/Contracts
